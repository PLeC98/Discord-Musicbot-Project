# 자동재생 설정 — 이 파일 한 곳만 고치면 버튼 선택 메뉴 / 확인 메시지 / 유튜브 검색에 모두 반영됩니다.
# 봇을 켜 둔 채로 고쳐도 됩니다(저장하면 다음 자동재생부터 적용).

# 장르 항목
#   키(id)  : 영문 소문자. (true·false·null 은 쓸 수 없습니다 — YAML이 값으로 읽습니다.)
#   label   : 선택 메뉴와 안내 문구에 쓰이는 표기
#   emoji   : 선택 메뉴 아이콘
#   keywords: 유튜브 검색어 후보. 자동재생 때마다 무작위로 하나를 고릅니다.

# 주의
#   · 들여쓰기는 공백 두 칸. 탭을 쓰면 파일을 읽지 못합니다.
#   · 장르는 최대 25개까지만 메뉴에 나옵니다(디스코드 제한).
#   · 검색어를 바꾸면 결과가 확 달라집니다. 믹스·메들리가 섞여 들어오면 검색어부터 손보세요.

# 전역 기본값. 장르에 같은 항목을 적으면 그 장르에서만 덮어씁니다.
defaults:
  # 미리 뽑아 대기열에 둘 곡 수. 사전 캐싱 수와는 무관합니다.
  prefetchCount: 1
  # 고를 곡의 길이 제한(초). maxDurationSec이 비어 있으면 상한 없음.
  minDurationSec: 30
  maxDurationSec: null
  # 제목에 이 말이 들어가면 고르지 않습니다(소문자로 비교).
  blockedKeywords:
    - tutorial
    - lesson
    - course
    - learn
    - learning
    - podcast
    - interview
    - talk
    - speech
    - lecture
    - review
    - unboxing
    - reaction
    - gameplay
    - full movie
    - full album
    - full episode
    - documentary
    - how to
    - guide
    - tips
    - tricks
    - vlog
    - practice
    - exercise
    - workout
    - meditation
    - asmr
    - story
    - audiobook
    - mix |
    - compilation
