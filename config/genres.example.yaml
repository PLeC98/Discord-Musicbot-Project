# 자동재생 설정 — 이 파일 한 곳만 고치면 버튼 선택 메뉴 / 확인 메시지 / 유튜브 검색에 모두 반영됩니다.
# 봇을 켜 둔 채로 고쳐도 됩니다(저장하면 다음 자동재생부터 적용).

# 장르 항목
#   이름     : 키가 곧 장르 이름입니다. 선택 메뉴와 안내 문구에 그대로 쓰입니다.
#              (true·false·null 은 쓸 수 없습니다.)
#              (숫자만으로 된 이름도 쓸 수 없습니다. "80년대"처럼 글자를 섞어주세요.)
#              적은 차례가 선택 메뉴에 나오는 차례입니다.
#              이름을 바꾸면 그 장르로 저장돼 있던 서버는 자동재생이 꺼집니다.
#   emoji   : 선택 메뉴 아이콘. 비우거나 이모지 한 글자만 적습니다.
#              (이모지가 아닌 값이 하나라도 있으면 디스코드가 메뉴 전체를 거부합니다.)
#   keywords: 유튜브 검색어 후보. 자동재생 때마다 무작위로 하나를 고릅니다.

# 주의
#   · 들여쓰기는 공백 두 칸. 탭을 쓰면 파일을 읽지 못합니다.
#   · 장르는 최대 25개까지만 메뉴에 나옵니다(디스코드 제한).
#   · 검색어를 바꾸면 결과가 확 달라집니다. 믹스·메들리가 섞여 들어오면 검색어부터 손보세요.

# 전역 기본값. 장르에 같은 항목을 적으면 그 장르에서만 덮어씁니다.
defaults:
  # 미리 뽑아 대기열에 둘 곡 수. 사전 캐싱 수와는 무관합니다.
  prefetchCount: 1
  # 고를 곡의 길이 제한(초). maxDurationSec이 비어 있으면 상한 없음.
  minDurationSec: 30
  maxDurationSec: 3600
  # 제목에 이 말이 들어가면 고르지 않습니다. 대소문자는 가리지 않습니다.
  blockedKeywords:
    - best of
    - tutorial
    - lesson
    - course
    - learn
    - learning
    - podcast
    - interview
    - talk
    - speech
    - lecture
    - review
    - unboxing
    - reaction
    - gameplay
    - full movie
    - full album
    - full episode
    - documentary
    - how to
    - guide
    - tips
    - tricks
    - vlog
    - practice
    - exercise
    - workout
    - meditation
    - asmr
    - story
    - audiobook
    - mix |
    - compilation
    - mix
    - メドレー
    - ランキング
    - top hits
    - playlist
    - mega hits
    - billboard top
