# 자동재생 설정 — 이 파일 한 곳만 고치면 버튼 선택 메뉴 / 확인 메시지 / 곡 고르기에 모두 반영됩니다.
# 봇을 켜 둔 채로 고쳐도 됩니다(저장하면 다음 자동재생부터 적용).

# ─ 장르 항목 ─────────────────────────────────────────────────────────────────
#   이름    : 키가 곧 장르 이름입니다. 선택 메뉴와 안내 문구에 그대로 쓰입니다.
#             (true, false, null, 숫자만으로 된 이름은 쓸 수 없습니다. "80년대"처럼 글자를 섞어주세요.)
#             적은 차례가 선택 메뉴에 나오는 차례입니다.
#             이름을 바꾸면 그 장르로 저장돼 있던 서버는 자동재생이 꺼집니다.
#   emoji  : 선택 메뉴 아이콘. 비우거나 이모지 한 글자만 적습니다.
#             (이모지가 아닌 값이 하나라도 있으면 디스코드가 메뉴 전체를 거부합니다.)
#   sources: 곡을 어디서 가져올지. 아래 "소스" 설명을 보세요. 하나는 있어야 합니다.

# ── 주의 ─────────────────────────────────────────────────────────────────────
#   · 들여쓰기는 공백 두 칸. 탭을 쓰면 파일을 읽지 못합니다.
#   · 장르는 최대 25개까지만 가능합니다. (디스코드의 드롭다운 메뉴 갯수 상한).
#   · 목록은 블록 표기(- 로 시작하는 줄)로 적어주세요. [a, b] 꼴로 적어도 읽히지만,
#     대시보드에서 저장할 때 서식이 조금 바뀝니다.

# ── 소스 별 설명 ──────────────────────────────────────────────────────────────
#
# 장르마다 소스를 여럿 둘 수 있습니다. 뽑을 때 weight (가중치) 비율로 골라 쓰고,
# 한 소스가 빈손이면 다음 소스로 넘어갑니다.
#
#   weight : 고를 확률. 적지 않으면 1. 키워드는 품질이 제일 낮으니 낮게 주는 편이 좋습니다.
#
# type: keyword                        (키 필요 없음)
#   유튜브에 검색어를 던져 결과를 씁니다. 품질이 가장 낮습니다.
#   keywords : (필수) 검색어 후보. 뽑을 때마다 무작위로 하나.
#
# type: lastfm                         (.env 의 LASTFM_API_KEY 필요)
#   Last.fm 태그로 곡 이름을 받아 유튜브에서 찾습니다.
#   tags  : (필수) 태그 목록. 태그마다 품질 편차가 크니 여럿 적는 편이 안전합니다.
#   pages : 몇 페이지까지 퍼 올릴지(기본 5). 깊은 쪽도 품질이 떨어지지 않습니다.
#
# type: lbradio                        (.env 의 LISTENBRAINZ_TOKEN 필요)
#   ListenBrainz가 짜 주는 50곡을 받아 유튜브에서 찾습니다.
#   tags   : (필수, prompt 를 적었다면 생략 가능) 장르 태그. MusicBrainz 공식 장르명을 씁니다.
#   mode   : easy · medium · hard(기본). 태그를 얼마나 넓게 잡을지입니다.
#              easy   씨앗 태그만 씁니다
#              medium 씨앗 태그 + 비슷한 태그 하나
#              hard   씨앗 태그 + 비슷한 태그 여럿
#            넓게 잡을수록 이웃 장르의 큰 아티스트가 딸려 와서, 이름과 반대로 hard 쪽이
#            더 유명한 곡을 줍니다. (청취수 중앙값)
#                       easy    medium      hard
#              jazz     2,713    9,727    46,671
#              rock     7,256   61,593   133,740
#              k-pop      641    3,420    26,506
#              metal    4,603   19,869    91,837
#            세 모드는 곡이 겹치지 않습니다. 상위 분류 취급이 아닙니다.
#            easy 로 두면 hard 에 나올 곡은 아예 안 나옵니다.
#
#            섞고 싶으면 **여럿 적으면 됩니다.** 한 번의 요청으로 50곡을 나눠 채워 줍니다.
#              mode: [hard, easy]
#            (소스를 둘로 나눠 weight 로 비율을 주는 방법도 그대로 됩니다.)
#   prompt : 날것 그대로 쓰고 싶을 때만. 예) "tag:(jazz,funk)::or" · "artist:(Miles Davis)"
#
# type: animethemes                    (키 필요 없음)
#   애니 주제가 전문 DB. TV Size 음원을 직접 제공합니다.
#   (유튜브에서 풀버전을 검색 후 적절한게 있으면 그쪽을 쓰고, 없으면 해당 DB의 TV Size 음원을 씁니다.)
#   themeType             : OP 또는 ED. 안 적으면 둘 다.
#   sequence              : 몇 번째 주제가인지. 1이면 OP1·ED1만.
#   yearFrom   / yearTo   : 방영 연도 범위.
#   season                : 특정 분기만(연도와 무관). Winter, Spring, Summer, Fall 중에서 고릅니다.
#                           예) [Fall] 이면 어느 해든 가을 방영만.
#   seasonFrom / seasonTo : 양 끝 분기. yearFrom / yearTo 와 짝으로 씁니다.
#                           "2020년 가을부터 2024년 봄까지"처럼 분기 단위로 자를 때 쓰세요.
#                             yearFrom: 2020
#                             seasonFrom: Fall
#                             yearTo: 2024
#                             seasonTo: Spring
#                           분기: Winter(1분기) → Spring(2분기) → Summer(3분기) → Fall(4분기).
#                           비워 두면 그 해 전체
#   mediaFormat           : 매체 종류. 웹과 같은 이름을 씁니다 (TV, TV Short, Movie, OVA, ONA, Special)
#
# type: vocadb / utaitedb / touhoudb    (키 필요 없음)
#   보컬로이드, 우타이테, 동방 곡 DB. 일부 설정값이 복잡합니다. 해당 사이트를 참고하며 설정하는걸 권합니다.
#     vocadb  : https://vocadb.net/
#     touhoudb: https://touhoudb.com/
#     utaitedb: https://utaitedb.net/
#   tags                  : 장르 태그(rock, pop, ballad, EDM, technopop, metal, 和風 …).
#   excludeTags           : 제외하고 싶은 태그.
#   songTypes             : 곡 종류. 웹은 일본어 버튼이지만 여기는 영어로 적습니다.
#                             指定なし        → Unspecified
#                             オリジナル曲    → Original        (vocadb 기본값)
#                             再編曲          → Rearrangement   (touhoudb에만 있습니다)
#                             カバー曲        → Cover           (utaitedb 기본값)
#                             編曲            → Arrangement     (touhoudb 기본값. touhoudb에만 있습니다)
#                             リマスター        → Remaster
#                             ショートバージョン  → ShortVersion (touhoudb에만 있습니다)
#                             インストゥルメンタル → Instrumental
#                             音楽PV             → MusicPV
#                             ドラマ             → DramaPV
#                             その他             → Other
#                             リミックス         → Remix        (vocadb, utaitedb에만 있습니다)
#                             マッシュアップ     → Mashup       (vocadb, utaitedb에만 있습니다)
#                             ライブ収録         → Live         (utaitedb에만 있습니다)
#   languages             : 노래 언어. ISO 코드로 적습니다. (ja, en, ko, zh, es, ru)
#   artistTypes           : 라이브러리 분류. Vocaloid, UTAU, SynthesizerV, CeVIO, VOICEVOX, Voiceroid, Utaite …
#   artists               : 특정 라이브러리만. 이름으로 적습니다. 예) [UNI]
#   minScore              : 최소 평가 점수 기준 (웹의 評価 점수)
#                           사이트마다 척도가 완전히 다릅니다. 같은 50이라도 남는 곡이 이만큼 다릅니다:
#                                         vocadb   utaitedb   touhoudb
#                             (안 적음)    297,703    25,054     46,557
#                             5             69,383       784      1,509
#                             10            38,357       168        212
#                             50             7,082         1          7
#                           vocadb는 26/09/18 기준, 1위가 3694점이지만 나머지 둘은 1위가 80점대입니다.
#   minLength / maxLength : 곡 길이(초) 범위.
#   minBpm    / maxBpm    : BPM 범위.
#   yearFrom  / yearTo    : 발표 연도 범위.
#   sort                  : 기본 RatingScore. FavoritedTimes, PublishDate, AdditionDate 등.
#
# type: spotify                           (스포티파이 자격증명 필요)
#   url : (필수) 재생목록·앨범·아티스트 주소.
#
# type: youtube                           (키 필요 없음)
#   url : (필수) 재생목록 주소. 믹스(주소에 list=RD…)는 곡 수에 끝이 없어 사용할 수 없습니다.

# ── 설정 ─────────────────────────────────────────────────────────────────────
# 전역 기본값. 장르에 같은 항목을 적으면 그 장르에서만 덮어씁니다.
defaults:
  # 미리 뽑아 대기열에 둘 곡 수. 사전 캐싱 수와는 무관합니다.
  prefetchCount: 1
  # 고를 곡의 길이 제한(초). maxDurationSec이 비어 있으면 상한 없음.
  minDurationSec: 60
  maxDurationSec: 3600
  # 제목에 이 말이 들어가면 고르지 않습니다. 대소문자는 가리지 않습니다.
  # (유튜브에서 찾아온 곡에만 걸립니다 — 출처가 확실한 소스는 거치지 않습니다.)
  blockedKeywords:
    - best of
    - tutorial
    - lesson
    - course
    - learn
    - learning
    - podcast
    - interview
    - speech
    - lecture
    - review
    - unboxing
    - reaction
    - gameplay
    - full movie
    - full album
    - full episode
    - documentary
    - how to
    - guide
    - tips
    - tricks
    - vlog
    - practice
    - exercise
    - workout
    - meditation
    - asmr
    - audiobook
    - compilation
    - mix
    - メドレー
    - ランキング
    - top hits
    - playlist
    - mega hits
    - billboard top
    - 플레이리스트
    - 플리
    - 믹스
    - 메들리

