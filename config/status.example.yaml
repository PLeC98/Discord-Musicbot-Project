# 봇 상태 메시지 — 디스코드 프로필에 뜨는 "듣는 중 …" 문구입니다.
# 봇을 켜 둔 채로 고쳐도 됩니다(저장하면 다음 회전부터 적용).
#
# interval : 문구를 바꾸는 간격(초). 최소 10초.
# messages : 평소에 번갈아 보여줄 문구들. 한 줄에 하나씩 그냥 적으면 됩니다.
#            활동 종류를 바꾸고 싶을 때만 풀어서 text/type으로 적습니다.
#              - 🎮 같이 놀아요        ← 이렇게만 적으면 "듣는 중"
#              - text: 🎮 같이 놀아요   ← 종류가 필요하면 이렇게
#                type: Playing
#            종류: Playing(게임 중) · Listening(듣는 중) · Watching(시청 중)
#                  Competing(경쟁 중) · Custom(말머리 없이 문구만)
# special  : 특정 기간·시간대에만 쓰는 문구. 위에서부터 먼저 맞는 것 하나만 씁니다.
#            그래서 좁은 기간을 넓은 기간보다 위에 적어야 합니다(크리스마스가 12월보다 위).
#              date  양력 MM-DD ~ MM-DD (연말을 걸쳐도 됩니다: 12-28 ~ 01-05)
#              lunar 음력 MM-DD ~ MM-DD
#              time  HH:MM ~ HH:MM (자정을 걸쳐도 됩니다: 22:00 ~ 06:00)
#            한 항목에 조건을 둘 이상 적으면 전부 맞아야 합니다.
#
# 주의
#   · 들여쓰기는 공백 두 칸. 탭을 쓰면 파일을 읽지 못합니다.
#   · 월·일·시·분은 두 자리로 적습니다(1월 5일 → 01-05). 한 자리면 엉뚱한 날에 걸립니다.
#   · 항목 이름은 겹치면 안 되고, 숫자만으로 된 이름(2024)은 쓸 수 없습니다.
#     이름에 숫자를 섞는 것은 괜찮습니다(12월_25일).
#   · 문구는 128자까지입니다.

interval: 60

messages:
  - 🎵 /play
  - 🎶 음악으로 하루를 채워봐요

special:
  크리스마스:
    date: 12-24 ~ 12-26
    messages:
      - 🎄 메리 크리스마스!

  심야:
    time: 22:00 ~ 06:00
    messages:
      - 🌌 별빛 아래 음악
      - 🛌 잠들기 전 노래 한곡
      - 🌑 달빛 아래 음악
      - 💤 졸려...
      - 🌃 밤새 함께해요

  새해:
    date: 01-01 ~ 01-02
    messages:
      - 🎉 새해 복 많이 받으세요!
      - 🥳 올해에도 좋은 음악과 함께!

  설날:
    lunar: 01-01 ~ 01-15
    messages:
      - 🌕 설날 맞이 음악
      - 🐉 새해 복 많이 받으세요!

  할로윈:
    date: 10-31 ~ 11-02
    messages:
      - 🎃 할로윈 분위기
      - 👻 무서운 음악 모드

  발렌타인:
    date: 02-14 ~ 02-15
    messages:
      - 💖 발렌타인 데이 스페셜
      - 🌹 사랑이 가득한 음악

  봄:
    date: 03-01 ~ 03-31
    messages:
      - 🌸 흩날리는 벚꽃 잎이♪
      - 🌼 봄바람 휘날리며♪

  여름휴가:
    date: 07-20 ~ 08-10
    messages:
      - 🏖️ 어디로 떠날까요?

  가을:
    date: 09-01 ~ 09-30
    messages:
      - 🍂 너를 닮은 이 시린 가을이 오면♪
      - 🍁 낙엽과 함께하는 음악

  겨울:
    date: 12-01 ~ 12-31
    messages:
      - ❄️ 눈꽃이 피어나 또 빛이 나♪
      - ⛄ 내 맘을 다 아나봐 하늘에서도♪
