# AI 보조 설정 — 자동재생이 유튜브에서 찾아온 후보를 모델에게 한 번 더 물어봅니다.
#
# ── 무엇을 하는 기능인가 ──────────────────────────────────────────────────────
# 자동재생이 곡 이름만 아는 소스(키워드·Last.fm)에서 후보를 고를 때, 규칙만으로는
# "믹스 1시간짜리"나 "제목에 장르 이름만 들어간 딴 장르 곡"을 놓칩니다.
# 모델에게 두 가지만 묻습니다.
#   song : 이 영상이 곡 하나인가 (믹스·메들리·앨범 전곡·강의가 아닌가)
#   fits : 요청한 장르가 맞는가
#
# 실측(140곡 정답표, gemma3n:e2b 기준)
#                        맞춘 비율   정밀도   재현율
#   규칙만                   86%      79%     97%
#   규칙 + 모델              95%      96%     94%
#
# ── 없어도 되는 기능입니다 ────────────────────────────────────────────────────
# enabled: false 가 기본입니다. 켜 두었더라도 모델을 못 부르면 규칙만으로 고르고 넘어갑니다.
# 재생이 멈추는 일은 없습니다.
#
# ── 어디에 붙이나 ────────────────────────────────────────────────────────────
# OpenAI 호환 주소면 무엇이든 됩니다. Ollama · LM Studio · vLLM · OpenAI 본체 등.
#   Ollama    : http://127.0.0.1:11434/v1   (키 불필요)
#   LM Studio : http://127.0.0.1:1234/v1    (키 불필요)
#   OpenAI    : https://api.openai.com/v1   (.env 의 AI_API_KEY 필요)
# 키는 이 파일이 아니라 .env 의 AI_API_KEY 에 넣습니다.

# 끄면 규칙만으로 고릅니다.
enabled: false

# OpenAI 호환 엔드포인트. 끝의 /v1 까지 적습니다.
baseUrl: http://127.0.0.1:11434/v1

# 모델 이름. 실측에서는 gemma3n:e2b(4.3GB)가 가장 나았습니다.
# 더 큰 e4b 는 오히려 박해져서 쓸 만한 곡까지 떨어뜨렸습니다(재현율 94% → 87%).
model: gemma3n:e2b

# 0 이면 같은 질문에 같은 답을 합니다. 판정에는 흔들릴 이유가 없습니다.
temperature: 0

# 이 시간을 넘기면 포기하고 규칙만으로 고릅니다(밀리초).
# 3070 Ti 에서 10곡 묶음에 17초였습니다. 느린 그래픽카드라면 넉넉히 잡으세요.
timeoutMs: 60000

# 한 번에 몇 곡을 묶어 물을지. 곡마다 따로 물으면 느립니다.
batchSize: 10

# 규칙이 이미 확신하는 후보는 묻지 않습니다(true 면 아낍니다).
# 확신은 채널 이름이 맞거나 길이가 맞아떨어질 때만 생기므로, 곡 이름만 아는 소스에서는
# 거의 생기지 않습니다 — 그래서 대개 켜 두어도 호출 수가 줄지 않습니다.
skipConfident: true

# 요청 본문에 그대로 얹을 값. 서비스마다 이름이 달라 여기서 직접 적습니다.
#   Ollama 계열 사고 조절 : think: false
#   OpenAI 계열          : reasoning_effort: low
extra: {}

# 판정 기준. 비우면 아래 기본 프롬프트를 씁니다(src/autoplayAssist.js).
#
# **프롬프트가 성능의 거의 전부입니다.** 같은 모델·같은 표본에서 프롬프트만 고쳐
# 맞춘 비율이 77% → 95%로 움직였습니다. 부정 목록을 길게 늘어놓는 것보다
# "곡 하나냐 여러 곡이냐"로 묻고 예를 붙이는 쪽이 훨씬 나았습니다.
#
# 답은 반드시 JSON 배열이어야 합니다: [{"n":1,"song":true,"fits":false}, ...]
prompt: ""
