# AI 보조 설정 — 자동재생이 유튜브에서 찾아온 후보를 모델에게 한 번 더 물어봅니다.
#
# ── 무엇을 하는 기능인가 ──────────────────────────────────────────────────────
# 자동재생이 곡 이름만 아는 소스(키워드·Last.fm)에서 후보를 고를 때, 규칙만으로는
# "믹스 1시간짜리"나 "제목에 장르 이름만 들어간 딴 장르 곡"을 놓칩니다.
# 모델에게 두 가지만 묻습니다.
#   song : 이 영상이 곡 하나인가 (믹스·메들리·앨범 전곡·강의가 아닌가)
#   fits : 요청한 장르가 맞는가
#
# 실측(140곡 정답표, gemma3n:e2b 기준)
#                        맞춘 비율   정밀도   재현율
#   규칙만                   86%      79%     97%
#   규칙 + 모델              95%      96%     94%
#
# ── 없어도 되는 기능입니다 ────────────────────────────────────────────────────
# enabled: false 가 기본입니다. 켜 두었더라도 모델을 못 부르면 규칙만으로 고르고 넘어갑니다.
# 재생이 멈추는 일은 없습니다.
#
# ── 어디에 붙이나 ────────────────────────────────────────────────────────────
# OpenAI 호환 주소면 무엇이든 됩니다. Ollama · LM Studio · vLLM · OpenAI 본체 등.
#
# ── 곁에 있는 파일들 ─────────────────────────────────────────────────────────
#   config/ai-keys.yaml     API 키. 프로바이더마다 따로 적습니다
#   config/ai-prompt.chatml 프롬프트. 긴 글을 YAML 에 섞으면 들여쓰기에 걸립니다

# 어디에 물을지. off 면 규칙만으로 고릅니다.
#
#   off                                          사용하지 않음
#
#   ollama · lmstudio · vllm · llamacpp          내 기기에서 도는 것. 키를 안 씁니다
#
#   ollama-cloud · openai · anthropic
#   aistudio · deepseek · mistral · xai
#   groq · together                              모델을 직접 내는 곳
#
#   openrouter · nanogpt · vercel · llmgateway   여러 곳을 묶어 파는 곳
#
#   vertex                                       버텍스 AI(제미니 네이티브).
#                                                키가 아니라 서비스 계정 JSON 을 씁니다
#
#   custom                                       그 밖의 OpenAI 호환 주소(아래 baseUrl 을 씁니다)
#
# 전부 OpenAI 호환 규격으로 부릅니다. 키는 config/ai-keys.yaml 의 **같은 이름 칸**을 씁니다.
# ollama 와 ollama-cloud 는 다른 곳입니다 — 앞은 내 기기, 뒤는 저쪽 서버입니다.
provider: off

# OpenAI 호환 엔드포인트.
#
# **provider 가 custom 일 때만 씁니다.** 다른 것을 골랐으면 그 서비스의 주소로 나갑니다
# (주소는 src/autoplayAssist.js 의 PROVIDER_SPECS 에 있습니다).
# 여기 없는 곳이거나, 프록시를 앞에 두었거나, 박힌 주소가 바뀌었으면 custom 으로 쓰세요.
baseUrl: ""

# ── 버텍스 AI 전용 ──────────────────────────────────────────────────────────
# provider: vertex 일 때만 씁니다. 주소를 이 둘로 조립합니다(baseUrl 을 안 씁니다).
#   location  리전. 비우면 global 입니다(그때는 호스트도 달라집니다)
#   project   비우면 서비스 계정 JSON 의 project_id 를 씁니다
location: ""
project: ""

# 모델 이름. 실측에서는 gemma3n:e2b(4.3GB)가 가장 나았습니다.
# 더 큰 e4b 는 오히려 박해져서 쓸 만한 곡까지 떨어뜨렸습니다(재현율 94% → 87%).
model: gemma3n:e2b

# 0 이면 같은 질문에 같은 답을 합니다. 판정에는 흔들릴 이유가 없습니다.
temperature: 0

# 이 시간을 넘기면 포기하고 규칙만으로 고릅니다(밀리초).
# 3070 Ti 에서 10곡 묶음에 17초였습니다. 느린 그래픽카드라면 넉넉히 잡으세요.
timeoutMs: 60000

# 한 번에 몇 곡을 묶어 물을지. 곡마다 따로 물으면 느립니다.
batchSize: 10

# 규칙이 이미 확신하는 후보는 묻지 않습니다(true 면 아낍니다).
# 확신은 채널 이름이 맞거나 길이가 맞아떨어질 때만 생기므로, 곡 이름만 아는 소스에서는
# 거의 생기지 않습니다 — 그래서 대개 켜 두어도 호출 수가 줄지 않습니다.
skipConfident: true

# 추가 파라미터: 한 줄에 하나씩 적습니다.
#   key=value            그대로 (true · false · 숫자는 알아서 바뀝니다)
#   key=json::{...}      JSON 으로 읽어 넣습니다 (객체·배열)
#   header::Name=value   본문이 아니라 요청 헤더에 넣습니다
#   key={{none}}         그 값을 아예 안 보냅니다 (temperature 처럼 늘 붙는 것을 뺄 때)
#
# 예)
#   extra: |
#     think=false                      # Ollama 계열 사고 조절
#     reasoning_effort=low             # OpenAI 계열
#     response_format=json::{\"type\":\"json_object\"}
#     header::X-Title=Discord Musicbot
#     temperature={{none}}
extra: ""

# 모델 목록에서 가릴 이름. `*` 만 쓰는 글롭이고, 대소문자를 가리지 않습니다.
#
# 저쪽 목록에는 영상·이미지 모델이나 한참 옛 모델도 섞여 나옵니다. 쓸 일이 없는 것을
# 가려 두면 고르는 칸이 짧아집니다. **모델 이름은 코드에 없습니다** — 여기서만 정합니다.
hideModels:
  - "*aqa*"
  - babbage-002
  - davinci-002
  - "*o1*"
  - "*o3*"
  - "*o4*"
  - "gpt-3.5*"
  - "*gpt-4*"
  - "*omni-moderation*"
  - "*gemini-2.5*"
  - "*sora*"
  - "*veo*"
  - "*dall-e*"
  - "*whisper*"
  - "*embedding*"
  - "*image*"
  - "*banana*"
  - "*audio*"
  - "*lyria*"
  - "*transcribe*"
  - "*robotics*"
  - "*translate*"
  - "*deep-research*"
  - "*gpt-live*"
  - "*tts*"
  - "*gpt-realtime*"
  - "*antigravity*"
  - "*computer-use*"
  - "*search-api*"

# ── 후보 목록의 모양 ────────────────────────────────────────────────────────
# 판정할 후보를 한 줄에 어떻게 적을지. 쓸 수 있는 자리표시자:
#   {{번호}}  1부터
#   {{장르}}  자동재생 장르 이름 (장르가 없으면 "랜덤")
#   {{제목}}  영상 제목  ← 이것은 반드시 넣어야 합니다
#   {{길이분}} {{길이초}}
#
# 업로더 이름은 넣을 수 없습니다. 넣어 봤더니 fits 정확도가 94% → 88%로 떨어졌습니다 —
# 유튜브의 그 칸은 대개 진짜 아티스트가 아니라 채널 이름입니다(Vevo · Radio Mix).
list:
  lineFormat: "{{번호}}. 장르={{장르}} 길이={{길이분}}분 제목={{제목}}"

  # 길이를 모르는 후보를 어떻게 할지.
  #   hide  그 자리표시자가 든 낱말째 뺍니다 (위 형식이면 "길이=3분" 이 통째로 빠집니다)
  #   text  아래 unknownText 로 적습니다
  #   zero  0 으로 적습니다 — 거짓을 알려 주는 셈이라 권장하지 않습니다
  unknownDuration: hide
  unknownText: 모름

# 프롬프트 섹션에 붙일 이름. 대시보드에서 시각적 표기를 위해 사용됩니다.
# 직접 설정할 필요가 없으며, 대시보드를 사용하지 않아 설정 파일을 직접 수정하는 경우에는 생성될 일이 없습니다.
# 모델에게 전송되지 않습니다.
promptNames: []

# 커스텀 프롬프트는 config/ai-prompt.chatml 에서 설정합니다. chatML 포맷을 따릅니다.
