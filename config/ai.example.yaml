# AI 보조 — 자동재생이 찾아온 후보를 모델에게 한 번 더 걸러 달라고 합니다.
# 곡 하나가 맞는지(믹스·메들리·강의가 아닌지), 요청한 장르가 맞는지를 묻습니다.
#
# provider: off 가 기본입니다. 켜 두어도 모델 호출에 실패하면 규칙만으로 고르며, 재생은 안 멈춥니다.
# 키는 config/ai-keys.yaml, 프롬프트는 config/ai-prompt.chatml 에 있습니다.

# 사용할 프로바이더
#   off                                        쓰지 않음
#   ollama · lmstudio · vllm · llamacpp        내 기기에서 도는 것. 키가 필요 없습니다
#   openai · anthropic · aistudio · deepseek
#   mistral · xai · groq · together
#   ollama-cloud                               모델을 직접 내는 곳
#   openrouter · nanogpt · vercel
#   llmgateway · neuralwatt                    여러 곳을 묶어 파는 곳
#   vertex                                     버텍스 AI. 키 대신 서비스 계정 JSON 을 씁니다
#   custom                                     그 밖의 OpenAI 호환 주소(아래 baseUrl 을 적습니다)
#
# 요청 규격(OpenAI · 앤트로픽 · 제미니)은 고른 곳에 맞춰 알아서 골라 씁니다.
# 키는 config/ai-keys.yaml 의 같은 이름 칸을 씁니다.
# ollama 와 ollama-cloud 는 다른 곳입니다 — 앞은 내 기기, 뒤는 저쪽 서버입니다.
provider: off

# provider 가 custom 일 때만 씁니다. 나머지는 각 서비스의 주소로 나갑니다.
# 목록에 없는 곳이거나 앞에 프록시를 두었으면 custom 으로 쓰세요.
baseUrl: ""

# provider: vertex 전용. 이 둘로 주소를 만듭니다(baseUrl 은 안 씁니다).
#   location  리전. 비우면 global 입니다
#   project   비우면 서비스 계정 JSON 의 project_id 를 씁니다
location: ""
project: ""

# 모델명. 저쪽이 부르는 이름 그대로 적습니다.
model: gemma3n:e2b

# 이 시간을 넘기면 포기하고 규칙만으로 고릅니다(밀리초).
timeoutMs: 60000

# 한 번에 몇 곡을 묶어 물을지. 곡마다 따로 물으면 느립니다.
batchSize: 10

# 규칙이 이미 확신하는 후보는 묻지 않습니다. 확신은 채널 이름이나 길이가 맞아떨어질 때만
# 생기므로, 곡 이름만 아는 소스에서는 켜 두어도 호출 수가 거의 줄지 않습니다.
skipConfident: true

# 아래 params 로 못 적는 값을 본문에 직접 얹습니다. 한 줄에 하나씩.
#   key=value            true · false · null · 숫자는 알아서 바뀝니다
#   key="value"          따옴표로 두르면 숫자처럼 보여도 글자입니다
#   a.b.c=value          점으로 안쪽 칸에 넣습니다
#   key=json::{...}      JSON 으로 읽어 넣습니다
#   header::Name=value   본문이 아니라 요청 헤더에 넣습니다
#   key={{none}}         그 값을 아예 안 보냅니다
#
# **경로는 언제나 본문 맨 위부터입니다** — 제미니처럼 안쪽 칸을 쓰는 곳은 경로를 그대로 적습니다.
#
# 예)
#   extra: |
#     think=false
#     temperature=0
#     generationConfig.topP=0.9
#     header::X-Title=Discord Musicbot
extra: ""

# 모델 목록에서 가릴 이름. `*` 만 쓰는 글롭이고 대소문자를 가리지 않습니다.
# 영상·이미지·TTS 처럼 쓸 일 없는 모델과 구식 모델을 접어 두는 용도입니다.
hideModels:
  - "*aqa*"
  - babbage-002
  - davinci-002
  - "*o1*"
  - "*o3*"
  - "*o4*"
  - "gpt-3.5*"
  - "*gpt-4*"
  - "*omni-moderation*"
  - "*gemini-1.5*"
  - "*gemini-2.5*"
  - "*sora*"
  - "*veo*"
  - "*dall-e*"
  - "*whisper*"
  - "*embedding*"
  - "*image*"
  - "*banana*"
  - "*audio*"
  - "*lyria*"
  - "*transcribe*"
  - "*robotics*"
  - "*translate*"
  - "*deep-research*"
  - "*gpt-live*"
  - "*tts*"
  - "*gpt-realtime*"
  - "*antigravity*"
  - "*computer-use*"
  - "*search-api*"

# 판정할 후보를 한 줄에 어떻게 적을지.
#   {{번호}}   1부터
#   {{장르}}   자동재생 장르 이름(없으면 "랜덤")
#   {{제목}}   영상 제목 ← 반드시 넣어야 합니다
#   {{길이분}} {{길이초}}
#
# 업로더 이름은 넣을 수 없습니다 — 유튜브의 그 칸은 아티스트가 아니라 채널 이름이라
# (Vevo · Radio Mix) 넣으면 장르 판정이 오히려 나빠집니다.
list:
  lineFormat: "{{번호}}. 장르={{장르}} 길이={{길이분}}분 제목={{제목}}"

  # 길이를 모르는 후보를 어떻게 할지.
  #   hide  그 자리표시자가 든 낱말째 뺍니다(위 형식이면 "길이=3분" 이 통째로)
  #   text  아래 unknownText 로 적습니다
  #   zero  0 으로 적습니다 — 거짓을 알려 주는 셈이라 권하지 않습니다
  unknownDuration: hide
  unknownText: 모름

# 프롬프트 섹션에 붙일 이름. 대시보드에서 구분하려고 쓰며 모델에게 가지 않습니다.
# 설정 파일을 직접 고치는 경우에는 적을 일이 없습니다.
promptNames: []

# 모델이 받는 칸 — 온도 · 추론 강도 · 최대 출력 토큰 등.
# **모델 이름으로 한 겹 나눕니다.** 모델을 바꿔도 앞 모델에서 고른 값이 따라오지 않게.
# 어떤 칸을 받는지는 모델마다 다르며(data/ai-models.json), 안 적은 칸은 저쪽 기본값으로 갑니다.
#
# 예)
#   params:
#     claude-opus-5:
#       temperature: 0        # 0 이면 같은 질문에 같은 답을 합니다
#       effort: high
#     gemini-3.8-flash:
#       thinkingLevel: medium
#
# 내 기기에서 도는 것과 custom 은 이 칸을 못 씁니다 — 위 extra 로 적습니다.
params: {}
