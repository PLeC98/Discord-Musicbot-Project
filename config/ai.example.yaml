# AI 보조 설정 — 자동재생이 유튜브에서 찾아온 후보를 모델에게 한 번 더 물어봅니다.
#
# ── 무엇을 하는 기능인가 ──────────────────────────────────────────────────────
# 자동재생이 곡 이름만 아는 소스(키워드·Last.fm)에서 후보를 고를 때, 규칙만으로는
# "믹스 1시간짜리"나 "제목에 장르 이름만 들어간 딴 장르 곡"을 놓칩니다.
# 모델에게 두 가지만 묻습니다.
#   song : 이 영상이 곡 하나인가 (믹스·메들리·앨범 전곡·강의가 아닌가)
#   fits : 요청한 장르가 맞는가
#
# 실측(140곡 정답표, gemma3n:e2b 기준)
#                        맞춘 비율   정밀도   재현율
#   규칙만                   86%      79%     97%
#   규칙 + 모델              95%      96%     94%
#
# ── 없어도 되는 기능입니다 ────────────────────────────────────────────────────
# enabled: false 가 기본입니다. 켜 두었더라도 모델을 못 부르면 규칙만으로 고르고 넘어갑니다.
# 재생이 멈추는 일은 없습니다.
#
# ── 어디에 붙이나 ────────────────────────────────────────────────────────────
# OpenAI 호환 주소면 무엇이든 됩니다. Ollama · LM Studio · vLLM · OpenAI 본체 등.
#   Ollama    : http://127.0.0.1:11434/v1   (키 불필요)
#   LM Studio : http://127.0.0.1:1234/v1    (키 불필요)
#   OpenAI    : https://api.openai.com/v1   (.env 의 AI_API_KEY 필요)
# 키는 이 파일이 아니라 .env 의 AI_API_KEY 에 넣습니다.

# 끄면 규칙만으로 고릅니다.
enabled: false

# OpenAI 호환 엔드포인트. 끝의 /v1 까지 적습니다.
baseUrl: http://127.0.0.1:11434/v1

# 모델 이름. 실측에서는 gemma3n:e2b(4.3GB)가 가장 나았습니다.
# 더 큰 e4b 는 오히려 박해져서 쓸 만한 곡까지 떨어뜨렸습니다(재현율 94% → 87%).
model: gemma3n:e2b

# 0 이면 같은 질문에 같은 답을 합니다. 판정에는 흔들릴 이유가 없습니다.
temperature: 0

# 이 시간을 넘기면 포기하고 규칙만으로 고릅니다(밀리초).
# 3070 Ti 에서 10곡 묶음에 17초였습니다. 느린 그래픽카드라면 넉넉히 잡으세요.
timeoutMs: 60000

# 한 번에 몇 곡을 묶어 물을지. 곡마다 따로 물으면 느립니다.
batchSize: 10

# 규칙이 이미 확신하는 후보는 묻지 않습니다(true 면 아낍니다).
# 확신은 채널 이름이 맞거나 길이가 맞아떨어질 때만 생기므로, 곡 이름만 아는 소스에서는
# 거의 생기지 않습니다 — 그래서 대개 켜 두어도 호출 수가 줄지 않습니다.
skipConfident: true

# 요청 본문에 그대로 얹을 값. 서비스마다 이름이 달라 여기서 직접 적습니다.
#   Ollama 계열 사고 조절 : think: false
#   OpenAI 계열          : reasoning_effort: low
extra: {}

# ── 후보 목록의 모양 ────────────────────────────────────────────────────────
# 판정할 후보를 한 줄에 어떻게 적을지. 쓸 수 있는 자리표시자:
#   {{번호}}  1부터
#   {{장르}}  자동재생 장르 이름 (장르가 없으면 "랜덤")
#   {{제목}}  영상 제목  ← 이것은 반드시 넣어야 합니다
#   {{길이분}} {{길이초}}
#
# 업로더 이름은 넣을 수 없습니다. 넣어 봤더니 fits 정확도가 94% → 88%로 떨어졌습니다 —
# 유튜브의 그 칸은 대개 진짜 아티스트가 아니라 채널 이름입니다(Vevo · Radio Mix).
list:
  lineFormat: "{{번호}}. 장르={{장르}} 길이={{길이분}}분 제목={{제목}}"

  # 길이를 모르는 후보를 어떻게 할지.
  #   hide  그 자리표시자가 든 낱말째 뺍니다 (위 형식이면 "길이=3분" 이 통째로 빠집니다)
  #   text  아래 unknownText 로 적습니다
  #   zero  0 으로 적습니다 — 거짓을 알려 주는 셈이라 권하지 않습니다
  unknownDuration: hide
  unknownText: 모름

# ── 대화 구성 ───────────────────────────────────────────────────────────────
# 모델에게 보낼 메시지를 섹션으로 짭니다. 섹션마다 역할(system · user · assistant)과
# 내용을 갖고, 적은 차례대로 보냅니다.
#
# **{{목록}} 이 어딘가에 있어야 합니다.** 그 자리에 위에서 만든 후보 목록이 들어갑니다.
# 통째로 비우면 아래와 같은 기본 구성을 씁니다(src/autoplayAssist.js).
#
# **프롬프트가 성능의 거의 전부입니다.** 같은 모델·같은 표본에서 이 글만 고쳐
# 맞춘 비율이 77% → 95%로 움직였습니다. 부정 목록을 길게 늘어놓는 것보다
# "곡 하나냐 여러 곡이냐"로 묻고 예를 붙이는 쪽이 훨씬 나았습니다.
#
# 답은 반드시 JSON 배열이어야 합니다: [{"n":1,"song":true,"fits":false}, ...]
prompt:
  - role: system
    text: |
      유튜브 검색 결과가 디스코드 음악봇의 자동재생에 쓸 만한지 판정한다.

      song — 이 영상이 **곡 하나**를 담고 있는가?
        true : 뮤직비디오 · 공식 오디오 · 라이브 한 곡 · 애니 오프닝 한 곡
               클래식 교향곡이나 소나타는 20~40분이어도 작품 하나이므로 true
        false: 여러 곡을 이어 붙인 것(믹스 · 플레이리스트 · 메들리 · 컴필레이션 · 앨범 전곡 · 라디오)
               음악이 아닌 것(강의 · 리뷰 · 예고편 PV · 랭킹영상 · 동요 모음)

      fits — 요청한 장르가 맞는가?
        아티스트와 곡을 알고 판단한다. 제목에 장르 이름이 들어 있어도 실제 장르가 다르면 false.
        장르가 "랜덤"이면 음악이기만 하면 true.

      예)
        장르=록 제목=System Of A Down - Toxicity (Official HD Video) → song=true, fits=true
        장르=록 제목=LMFAO - Party Rock Anthem → song=true, fits=false (제목에 rock이 있지만 일렉트로닉이다)
        장르=팝 제목=Pop Hits 2021 - Ariana Grande, Maroon 5, Taylor Swift → song=false (여러 곡)
        장르=클래식 제목=Beethoven: Symphony No. 7 (41분) → song=true, fits=true (작품 하나)
        장르=로파이 제목=Maroon 5 - Girls Like You → song=true, fits=false (로파이가 아니다)

      JSON 배열로만 답한다. 설명하지 않는다.
      [{"n":1,"song":true,"fits":false}, ...]

  - role: user
    text: "{{목록}}"
