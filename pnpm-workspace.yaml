allowBuilds:
  "@discordjs/opus": true
  better-sqlite3: true
  esbuild: true
  ffmpeg-static: true
  vue-demi: true
  youtube-dl-exec: true

minimumReleaseAgeExclude:
  - vite@8.1.0

packages:
  - "dashboard/client"

patchedDependencies:
  "@discordjs/node-pre-gyp@0.4.5": patches/@discordjs__node-pre-gyp@0.4.5.patch

# 이행 의존성 보안 강제 상향 (2026-08-17):
# tar: 픽스가 7.5.x에만 존재, node-pre-gyp의 ^6로는 도달 불가라 포크 스코프로 상향 (>=7.5.21).
# undici: @discordjs/rest 고정 버전이 취약, 픽스는 >=6.28.0. 7/8은 discord.js 스테이블 지원 시 승계.
overrides:
  "@discordjs/node-pre-gyp>tar": ^7.5.21
  undici: ^6.28.0
