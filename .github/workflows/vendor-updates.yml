name: Vendor updates

# 외부 도구(bgutil, ffmpeg)의 기본 버전(src/config/vendor-versions.ts)을 Dependabot처럼 매주 확인한다.
# 새 버전이 나오면 버전을 올리는 PR을 열고, 고정된 bgutil 버전의 lockfile에 알려진 취약점이 있는데 수정된 버전이 없으면 이슈를 연다.
# GITHUB_TOKEN으로 연 PR에서는 다른 워크플로가 자동으로 실행되지 않으므로 해당 브랜치에서 CI를 직접 실행한다(workflow_dispatch는 예외).
# PR을 열려면 저장소 설정에서 "Allow GitHub Actions to create and approve pull requests"가 켜져 있어야 한다.

on:
  schedule:
    - cron: "0 0 * * 1" # 월요일 09:00 KST(Dependabot과 같은 시각)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vendor-updates
  cancel-in-progress: false

jobs:
  check:
    name: Check vendor versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # 설치할 의존성 없이 실행된다(Node 내장 모듈과 저장소의 순수 모듈만 사용). 새 버전이 있으면 기본값 파일을 수정하고, 다음 단계에서 PR로 올린다
      - name: Check
        run: |
          node scripts/check-vendor-updates.ts --write > result.json
          cat result.json

      - name: Open a pull request for new versions
        run: |
          bgutil=$(jq -r '.bgutil.newer // empty' result.json)
          ffmpeg=$(jq -r '.ffmpeg.newer // empty' result.json)
          if [ -z "$bgutil$ffmpeg" ]; then echo "새 버전 없음"; exit 0; fi
          branch="chore/vendor-${bgutil:-same}-${ffmpeg:-same}"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then echo "브랜치가 이미 있음: $branch"; exit 0; fi

          parts=()
          [ -n "$bgutil" ] && parts+=("bgutil $(jq -r '.bgutil.current' result.json) → $bgutil")
          [ -n "$ffmpeg" ] && parts+=("ffmpeg $(jq -r '.ffmpeg.current' result.json) → $ffmpeg")
          title="chore(vendor): ${parts[0]}${parts[1]:+, ${parts[1]}}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add src/config/vendor-versions.ts
          git commit -m "$title"
          git push origin "$branch"

          {
            echo "외부 도구의 기본 버전을 올립니다(\`src/config/vendor-versions.ts\`)."
            echo
            for part in "${parts[@]}"; do echo "- $part"; done
            if [ -n "$bgutil" ]; then
              echo
              echo "bgutil lockfile의 알려진 취약점(npm audit, PR을 만든 시점 기준): 현재 버전 $(jq -r '.bgutil.audit.current.total' result.json)건 → $bgutil $(jq -r '.bgutil.audit.newer.total' result.json)건"
            fi
            echo
            echo "이미 설치된 환경에서는 봇을 끈 뒤 업데이트하세요(bgutil은 \`pnpm run update:bgutil\`, ffmpeg는 \`pnpm run install:ffmpeg\`)."
            echo
            echo "이 PR은 GITHUB_TOKEN으로 만들어져서 CI 체크가 자동으로 실행되지 않습니다. 이 PR 화면 아래쪽에 있는 워크플로 승인 버튼을 눌러 실행하세요."
          } > body.md
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" --title "$title" --body-file body.md
          gh workflow run ci.yml --ref "$branch"

      - name: Open an issue for lockfile vulnerabilities
        run: |
          total=$(jq -r '.bgutil.audit.current.total' result.json)
          newer=$(jq -r '.bgutil.audit.newer.total // empty' result.json)
          # 취약점이 수정된 새 버전이 있으면 앞 단계의 PR에서 다룬다
          if [ "$total" = "0" ] || [ "$newer" = "0" ]; then echo "이슈 열 필요 없음"; exit 0; fi
          current=$(jq -r '.bgutil.current' result.json)
          title="bgutil $current lockfile에서 알려진 취약점 발견"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq length)
          if [ "$open" != "0" ]; then echo "이미 열려 있음: $title"; exit 0; fi
          {
            echo "고정된 bgutil 버전($current)의 \`server/package-lock.json\`에서 알려진 취약점이 발견됐습니다(\`npm audit --package-lock-only\` 기준)."
            echo
            jq -r '.bgutil.audit.current | "critical \(.critical), high \(.high), moderate \(.moderate), low \(.low)"' result.json
            echo
            echo "아직 취약점이 수정된 버전이 없습니다. 새 버전이 나오면 이 워크플로가 업데이트 PR을 엽니다."
          } > issue.md
          gh issue create --title "$title" --body-file issue.md
