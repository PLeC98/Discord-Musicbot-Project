name: Vendor updates

# 따로 받는 도구(bgutil · ffmpeg)의 기본 버전(src/config/vendor-versions.ts)을 Dependabot 처럼 주마다 본다.
# 새 버전이 있으면 올리는 PR 을 열고, 고정한 bgutil 잠금 파일에 알려진 취약점이 있는데 고친 태그가 없으면 이슈를 연다.
# GITHUB_TOKEN 으로 연 PR 은 다른 워크플로를 깨우지 않으므로 그 브랜치에 CI 를 직접 부른다(workflow_dispatch 는 예외로 돈다).
# PR 을 열려면 저장소 설정의 "Allow GitHub Actions to create and approve pull requests" 가 켜져 있어야 한다.

on:
  schedule:
    - cron: "0 0 * * 1" # 월요일 09:00 KST(Dependabot 과 같은 때)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vendor-updates
  cancel-in-progress: false

jobs:
  check:
    name: Check vendor versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # 의존성 없이 돈다(노드 내장 · 저장소의 순수 모듈만). 새 버전이 있으면 기본값 파일을 고쳐 둔다(아래에서 PR 로 올린다)
      - name: Check
        run: |
          node scripts/check-vendor-updates.ts --write > result.json
          cat result.json

      - name: Open a pull request for new versions
        run: |
          bgutil=$(jq -r '.bgutil.newer // empty' result.json)
          ffmpeg=$(jq -r '.ffmpeg.newer // empty' result.json)
          if [ -z "$bgutil$ffmpeg" ]; then echo "올릴 것 없음"; exit 0; fi
          branch="chore/vendor-${bgutil:-same}-${ffmpeg:-same}"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then echo "이미 있음: $branch"; exit 0; fi

          parts=()
          [ -n "$bgutil" ] && parts+=("bgutil $(jq -r '.bgutil.current' result.json) → $bgutil")
          [ -n "$ffmpeg" ] && parts+=("ffmpeg $(jq -r '.ffmpeg.current' result.json) → $ffmpeg")
          title="chore(vendor): ${parts[0]}${parts[1]:+, ${parts[1]}}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add src/config/vendor-versions.ts
          git commit -m "$title"
          git push origin "$branch"

          {
            echo "따로 받는 도구의 기본 버전을 올립니다(\`src/config/vendor-versions.ts\`)."
            echo
            for part in "${parts[@]}"; do echo "- $part"; done
            if [ -n "$bgutil" ]; then
              echo
              echo "bgutil 잠금 파일의 알려진 취약점(npm audit, 지금의 DB): 지금 $(jq -r '.bgutil.audit.current.total' result.json)건 → $bgutil $(jq -r '.bgutil.audit.newer.total' result.json)건"
            fi
            echo
            echo "설치한 곳은 봇을 끄고 \`pnpm run update:bgutil\` · \`pnpm run install:ffmpeg\` 로 옮깁니다."
            echo
            echo "이 PR 은 vendor-updates 워크플로가 GITHUB_TOKEN 으로 열어 CI 가 저절로 돌지 않습니다. 같은 워크플로가 이 브랜치에 CI 를 불렀습니다(Actions 탭)."
          } > body.md
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" --title "$title" --body-file body.md
          gh workflow run ci.yml --ref "$branch"

      - name: Open an issue for lockfile vulnerabilities
        run: |
          total=$(jq -r '.bgutil.audit.current.total' result.json)
          newer=$(jq -r '.bgutil.audit.newer.total // empty' result.json)
          # 고친 새 태그가 있으면 위의 PR 이 그 몫이다
          if [ "$total" = "0" ] || [ "$newer" = "0" ]; then echo "이슈 없음"; exit 0; fi
          current=$(jq -r '.bgutil.current' result.json)
          title="bgutil $current 잠금 파일에 알려진 취약점"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq length)
          if [ "$open" != "0" ]; then echo "이미 열려 있음: $title"; exit 0; fi
          {
            echo "고정한 bgutil 태그($current)의 \`server/package-lock.json\` 에 알려진 취약점이 있습니다(npm audit --package-lock-only)."
            echo
            jq -r '.bgutil.audit.current | "critical \(.critical) · high \(.high) · moderate \(.moderate) · low \(.low)"' result.json
            echo
            echo "고친 태그가 아직 없습니다. 새 태그가 나오면 이 워크플로가 올리는 PR 을 엽니다."
          } > issue.md
          gh issue create --title "$title" --body-file issue.md
