name: Vendor updates

# 외부 도구(bgutil, ffmpeg)의 기본 버전(src/config/vendor-versions.ts)을 Dependabot처럼 매주 확인한다.
# 새 버전이 나오면 버전을 올리는 PR을 열고, 고정된 bgutil 버전의 lockfile에 알려진 취약점이 있으면 이슈 하나에서 매주 숫자를 고친다(없어지면 닫는다).
# push, PR, 이슈 생성에는 GitHub App 토큰을 쓴다. GITHUB_TOKEN으로 만든 PR에서는 CI가 자동으로 실행되지 않기 때문이다.
# App의 Client ID는 저장소 Variables의 VENDOR_APP_CLIENT_ID에, 개인 키는 Secrets의 VENDOR_APP_KEY에 넣는다. App 권한: Contents, Pull requests, Issues 읽기/쓰기.

on:
  schedule:
    - cron: "0 0 * * 1" # 월요일 09:00 KST(Dependabot과 같은 시각)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vendor-updates
  cancel-in-progress: false

jobs:
  check:
    name: Check vendor versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      # 기본 토큰(읽기)으로 받고 자격 증명을 남기지 않는다. App 토큰은 Check 뒤에 만들어 push, PR, 이슈 단계에만 준다
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # 설치할 의존성 없이 실행된다(Node 내장 모듈과 저장소의 순수 모듈만 사용). 새 버전이 있으면 기본값 파일을 수정하고, 다음 단계에서 PR로 올린다
      - name: Check
        run: |
          node scripts/check-vendor-updates.ts --write > result.json
          cat result.json

      - name: Create GitHub App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.VENDOR_APP_CLIENT_ID }}
          private-key: ${{ secrets.VENDOR_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Open a pull request for new versions
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          bgutil=$(jq -r '.bgutil.newer // empty' result.json)
          ffmpeg=$(jq -r '.ffmpeg.newer // empty' result.json)
          cloudflare=$(jq -r 'if .cloudflare.changed then "changed" else empty end' result.json)
          if [ -z "$bgutil$ffmpeg$cloudflare" ]; then echo "새 버전 없음"; exit 0; fi
          branch="chore/vendor-${bgutil:-same}-${ffmpeg:-same}${cloudflare:+-cloudflare-$(date -u +%F)}"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then echo "브랜치가 이미 있음: $branch"; exit 0; fi

          parts=()
          [ -n "$bgutil" ] && parts+=("bgutil $(jq -r '.bgutil.current' result.json) → $bgutil")
          [ -n "$ffmpeg" ] && parts+=("ffmpeg $(jq -r '.ffmpeg.current' result.json) → $ffmpeg")
          [ -n "$cloudflare" ] && parts+=("Cloudflare IP 대역 갱신")
          title="chore(vendor): $(IFS=,; echo "${parts[*]}" | sed 's/,/, /g')"

          bot="${{ steps.app.outputs.app-slug }}[bot]"
          # push 만 App 토큰으로(checkout 이 자격 증명을 남기지 않았다)
          gh auth setup-git
          git config user.name "$bot"
          git config user.email "$(gh api "/users/$bot" --jq .id)+$bot@users.noreply.github.com"
          git switch -c "$branch"
          git add src/config/vendor-versions.ts data/cloudflare-ips.json
          git commit -m "$title"
          git push origin "$branch"

          {
            echo "외부 도구의 기본 버전(\`src/config/vendor-versions.ts\`)이나 Cloudflare IP 대역(\`data/cloudflare-ips.json\`, 대시보드가 사용자 IP를 읽을 때 씀)을 갱신합니다."
            echo
            for part in "${parts[@]}"; do echo "- $part"; done
            if [ -n "$bgutil" ]; then
              echo
              echo "bgutil lockfile의 알려진 취약점(npm audit, PR을 만든 시점 기준): 현재 버전 $(jq -r '.bgutil.audit.current.total' result.json)건 → $bgutil $(jq -r '.bgutil.audit.newer.total' result.json)건"
            fi
            echo
            echo "이미 설치된 환경에서는 봇을 끈 뒤 업데이트하세요(bgutil은 \`pnpm run update:bgutil\`, ffmpeg는 \`pnpm run install:ffmpeg\`, Cloudflare 대역은 봇을 다시 시작하면 적용)."
          } > body.md
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" --title "$title" --body-file body.md

      # 이슈는 라벨로 찾는다(제목은 바뀔 수 있다). 라벨이 붙은 이슈가 없으면 이 워크플로의 계정이 연 "bgutil " 제목 이슈를 찾아 라벨을 붙인다(scripts/vendor-issue).
      # 열려 있으면 매주 제목과 본문의 숫자를 지금 것으로 고치고, 알려진 취약점이 없어지면 닫는다
      - name: Track lockfile vulnerabilities in an issue
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          label="bgutil-audit"
          current=$(jq -r '.bgutil.current' result.json)
          total=$(jq -r '.bgutil.audit.current.total' result.json)
          newer=$(jq -r '.bgutil.newer // empty' result.json)
          newerTotal=$(jq -r '.bgutil.audit.newer.total // empty' result.json)
          gh label create "$label" --color B60205 --description "bgutil 잠금 파일의 알려진 취약점(vendor-updates)" --force > /dev/null
          issue=$(gh issue list --state open --limit 500 --json number,title,author,labels | node scripts/vendor-issue.ts "$label" "${{ steps.app.outputs.app-slug }}" "bgutil ")
          [ -n "$issue" ] && gh issue edit "$issue" --add-label "$label" > /dev/null

          if [ "$total" = "0" ]; then
            if [ -n "$issue" ]; then
              gh issue close "$issue" --comment "고정된 bgutil 버전($current)의 \`server/package-lock.json\`에 알려진 취약점이 없습니다($(date -u +%F) 기준)."
              echo "닫음: #$issue"
            else
              echo "알려진 취약점 없음"
            fi
            exit 0
          fi

          title="bgutil $current lockfile에서 알려진 취약점 발견"
          {
            echo "고정된 bgutil 버전($current)의 \`server/package-lock.json\`에서 알려진 취약점이 발견됐습니다(\`npm audit --package-lock-only\` 기준, $(date -u +%F) 갱신)."
            echo
            jq -r '.bgutil.audit.current | "critical \(.critical), high \(.high), moderate \(.moderate), low \(.low) (총 \(.total)건)"' result.json
            echo
            if [ -z "$newer" ]; then
              echo "아직 새 버전이 없습니다. 새 버전이 나오면 이 워크플로가 업데이트 PR을 엽니다."
            elif [ "$newerTotal" = "0" ]; then
              echo "새 버전 $newer 에는 알려진 취약점이 없습니다. 업데이트 PR을 머지하면 다음 확인에서 이 이슈를 닫습니다."
            else
              echo "새 버전 $newer 에도 알려진 취약점이 ${newerTotal}건 있습니다."
            fi
            echo
            echo "이 워크플로가 매주 이 본문을 고칩니다."
          } > issue.md
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --title "$title" --body-file issue.md > /dev/null
            echo "고침: #$issue"
          else
            gh issue create --title "$title" --body-file issue.md --label "$label"
          fi

      # yt-dlp 서명 키가 바뀌었으면(저장소의 public.key 가 고정한 지문이 아니거나 최신 릴리스 서명이 data/ 의 키로 맞지 않으면) 이슈를 연다. PR 은 열지 않는다(새 키는 사람이 yt-dlp 의 공지와 대조해 넣는다).
      # 이슈는 라벨로만 찾는다(bgutil 이슈를 고르지 않게 제목 접두사를 넘기지 않는다). 다시 맞으면 닫는다
      - name: Track the yt-dlp signing key in an issue
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          label="ytdlp-signing-key"
          gh label create "$label" --color B60205 --description "yt-dlp 릴리스 서명 키가 data/ 의 키와 다름(vendor-updates)" --force > /dev/null
          issue=$(gh issue list --state open --limit 500 --json number,title,author,labels | node scripts/vendor-issue.ts "$label" "${{ steps.app.outputs.app-slug }}" "")

          if [ "$(jq -r '.ytdlpKey.same' result.json)" = "true" ]; then
            if [ -n "$issue" ]; then
              gh issue close "$issue" --comment "yt-dlp 서명 키가 \`data/yt-dlp-signing-key.asc\` 와 같습니다($(date -u +%F) 기준)."
              echo "닫음: #$issue"
            else
              echo "yt-dlp 서명 키 그대로"
            fi
            exit 0
          fi

          title="yt-dlp 릴리스 서명 키가 data/ 의 키와 다름"
          {
            echo "yt-dlp 릴리스의 서명이 저장소에 둔 키(\`data/yt-dlp-signing-key.asc\`)로 맞지 않습니다($(date -u +%F) 갱신). 그동안 봇은 새 yt-dlp 를 설치하지 않고 지금 버전으로 돕니다."
            echo
            jq -r '.ytdlpKey.problem // empty' result.json
            jq -r '.ytdlpKey.releases[] | "- \(.repo) \(.tag): \(if .ok then "서명 맞음" else .reason end)"' result.json
            echo
            echo "yt-dlp 의 공지(README 의 서명 절, 릴리스 노트)와 대조한 뒤 새 키로 \`data/yt-dlp-signing-key.asc\` 와 \`src/sources/ytdlp-release.ts\` 의 지문을 바꾸세요. 확인 전에 급하면 운영자는 \`pnpm run update:ytdlp --skip-signature\` 로 설치할 수 있습니다(체크섬은 확인)."
            echo
            echo "이 워크플로가 매주 이 본문을 고칩니다."
          } > issue.md
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --title "$title" --body-file issue.md > /dev/null
            echo "고침: #$issue"
          else
            gh issue create --title "$title" --body-file issue.md --label "$label"
          fi
