name: OSV-Scanner

# 잠금 파일의 의존성을 OSV DB(GitHub 권고 · npm 등 여러 출처를 모은 것)로 본다. 결과는 Security > Code scanning 에 올라간다.
# PR 은 기준 브랜치와 비교해 새로 생긴 취약점이 있을 때만 막고, main 과 정기 검사는 남은 것을 모두 올린다
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1" # 월요일 09:00 KST(Dependabot 과 같은 때)

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan-pr:
    if: github.event_name == 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0

  scan:
    if: github.event_name != 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
