name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 잠금 파일의 알려진 취약점(npm 권고). high 이상이면 막는다. 고칠 버전이 없어 넘길 것은 pnpm-workspace.yaml 의 auditConfig.ignoreGhsas 에 까닭과 함께
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        run: npm install -g pnpm@12.11.2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Audit
        run: pnpm audit --audit-level high

  test-and-build:
    name: Test and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    env:
      NODE_ENV: test
      DISCORD_TOKEN: ci-placeholder
      CLIENT_ID: "000000000000000000"
      # 비밀값 암호화 키의 임시 값(32바이트 0). 테스트가 쓰는 모양만 맞춘다
      SECRETS_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    steps:
      - name: Configure git to keep LF line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        run: npm install -g pnpm@12.11.2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Create test environment file
        run: node -e "require('node:fs').writeFileSync('.env', '')"

      # postinstall 이 대시보드 화면도 빌드한다(빌드가 깨지면 여기서 멈춘다). yt-dlp 도 설치한다(릴리스 조회가 인증 없는 한도에 걸리지 않게 토큰을 넘긴다)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Check formatting
        run: pnpm run format:check

      - name: Run tests
        if: matrix.os != 'ubuntu-latest'
        run: pnpm test

      # 커버리지는 참고용이라 한 곳에서만 재서 올린다. 테스트는 같은 것을 돌린다
      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run test:coverage

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # 위 matrix 에 없는 yt-dlp 판(macOS universal2, Linux arm64)의 다운로드, 서명, 압축 풀기, 실행만 본다.
  # 전체 테스트는 돌리지 않는다(macOS 는 ffmpeg 를 받지 않아 ffmpeg 가 있다고 보는 테스트가 실패한다)
  ytdlp:
    name: yt-dlp (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-24.04-arm

    env:
      NODE_ENV: test
      DISCORD_TOKEN: ci-placeholder
      CLIENT_ID: "000000000000000000"
      SECRETS_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        run: npm install -g pnpm@12.11.2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Create test environment file
        run: node -e "require('node:fs').writeFileSync('.env', '')"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # CI 에서는 바이너리가 없으면 건너뛰지 않고 실패한다(설치가 깨졌다는 뜻이다)
      - name: Run yt-dlp tests
        run: node --test test/sources/ytdlp-wrapper.test.ts
