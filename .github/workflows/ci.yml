name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    env:
      NODE_ENV: test
      DISCORD_TOKEN: ci-placeholder
      CLIENT_ID: "000000000000000000"

    steps:
      - name: Configure git to keep LF line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        run: npm install -g pnpm@11.13.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Create test environment file
        run: node -e "require('node:fs').writeFileSync('.env', '')"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Check formatting
        run: pnpm run format:check

      - name: Run tests
        if: matrix.os != 'ubuntu-latest'
        run: pnpm test

      # 커버리지는 참고용이라 한 곳에서만 재서 올린다. 테스트는 같은 것을 돌린다
      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run test:coverage

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7.1.1
        with:
          files: lcov.info
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Build dashboard
        run: pnpm run build:dashboard
