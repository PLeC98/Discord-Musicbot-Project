name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 잠금 파일의 알려진 취약점(npm 권고). high 이상이면 막는다. 고칠 버전이 없어 넘길 것은 pnpm-workspace.yaml 의 auditConfig.ignoreGhsas 에 까닭과 함께
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        run: npm install -g pnpm@12.11.2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Audit
        run: pnpm audit --audit-level high

  test-and-build:
    name: Test and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # arm64 는 라즈베리파이, 클라우드 ARM 같은 자체 호스팅 환경. CPU 마다 yt-dlp, ffmpeg, 네이티브 모듈의 빌드가 다르다
        os:
          - ubuntu-latest
          - windows-latest
          - ubuntu-24.04-arm
          - windows-11-arm
          - macos-latest

    env:
      NODE_ENV: test
      DISCORD_TOKEN: ci-placeholder
      CLIENT_ID: "000000000000000000"
      # 비밀값 암호화 키의 임시 값(32바이트 0). 테스트가 쓰는 모양만 맞춘다
      SECRETS_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    steps:
      - name: Configure git to keep LF line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        run: npm install -g pnpm@12.11.2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Create test environment file
        run: node -e "require('node:fs').writeFileSync('.env', '')"

      # macOS 는 설치 스크립트가 ffmpeg 를 다운로드하지 않는다(BtbN 빌드가 없다). 사용자 안내와 같이 brew 로 깔아 PATH 에 둔다
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"

      # postinstall 이 대시보드 화면도 빌드한다(빌드가 깨지면 여기서 멈춘다). yt-dlp 도 설치한다
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Check formatting
        run: pnpm run format:check

      - name: Run tests
        if: matrix.os != 'ubuntu-latest'
        run: pnpm test

      # 커버리지는 참고용이라 한 곳에서만 재서 올린다. 테스트는 같은 것을 돌린다
      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run test:coverage

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
