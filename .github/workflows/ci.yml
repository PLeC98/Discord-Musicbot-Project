name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    env:
      NODE_ENV: test
      DISCORD_TOKEN: ci-placeholder
      CLIENT_ID: "000000000000000000"

    steps:
      - name: Configure git to keep LF line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set up pnpm
        run: npm install -g pnpm@11.13.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Create test environment file
        run: node -e "require('node:fs').writeFileSync('.env', '')"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Run tests
        run: pnpm test

      - name: Build dashboard
        run: pnpm run build:dashboard
